<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 290" width="220" height="290">
  <defs>
    <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFECB3"/>
      <stop offset="0.45" stop-color="#F8D45F"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="gemRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8313E"/>
      <stop offset="1" stop-color="#B80E1E"/>
    </linearGradient>
    <linearGradient id="gemBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2966CF"/>
      <stop offset="1" stop-color="#0A3280"/>
    </linearGradient>
    <linearGradient id="gemGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1AB050"/>
      <stop offset="1" stop-color="#056B24"/>
    </linearGradient>
  </defs>

  <!-- ═══ CROWN ═══ -->
  <g>
    <!-- Main crown body — 5 peaks (3 tall + 2 short) -->
    <path d="
      M 56,100
      C 56,92 58,86 62,78
      L 76,88
      C 80,72 85,48 90,34
      L 97,72
      C 100,52 106,24 110,8
      C 114,24 120,52 123,72
      L 130,34
      C 135,48 140,72 144,88
      L 158,78
      C 162,86 164,92 164,100
      Z
    " fill="url(#crownGrad)"/>

    <!-- Crown base band -->
    <rect x="52" y="100" width="116" height="14" rx="4" ry="4" fill="url(#crownGrad)"/>

    <!-- Inner arch details -->
    <path d="M 70,100 Q 80,90 90,100" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.35"/>
    <path d="M 98,100 Q 110,88 122,100" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.35"/>
    <path d="M 130,100 Q 140,90 150,100" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.35"/>

    <!-- Jewels — South Sudanese flag colours -->
    <circle cx="110" cy="18" r="6" fill="url(#gemRed)"/>
    <circle cx="110" cy="16.5" r="2" fill="#FF8A94" opacity="0.6"/>
    <circle cx="90" cy="40" r="5" fill="url(#gemBlue)"/>
    <circle cx="90" cy="38.5" r="1.8" fill="#6EA4F4" opacity="0.55"/>
    <circle cx="130" cy="40" r="5" fill="url(#gemGreen)"/>
    <circle cx="130" cy="38.5" r="1.8" fill="#5FE08C" opacity="0.55"/>

    <!-- Small gold dots at outer peaks -->
    <circle cx="66" cy="80" r="3" fill="#FFECB3" opacity="0.8"/>
    <circle cx="154" cy="80" r="3" fill="#FFECB3" opacity="0.8"/>

    <!-- Band highlights -->
    <rect x="68" y="103" width="18" height="3" rx="1.5" fill="#FFECB3" opacity="0.25"/>
    <rect x="134" y="103" width="18" height="3" rx="1.5" fill="#FFECB3" opacity="0.25"/>
  </g>

  <!-- ═══ "JB" SCRIPT — Instagram / Billabong style ═══ -->
  <g fill="#1F1F1F">
    <!-- J crossbar flourish -->
    <path d="
      M 62,132
      C 66,128 80,126 92,127
      C 97,127.5 100,130 98,133
      C 96,136 84,137 74,136.5
      C 66,136 60,135 62,132
      Z
    "/>

    <!-- J stem + hook -->
    <path d="
      M 88,133
      C 89,133 92,133 93,134
      C 95,140 96,155 96,168
      C 96,180 94,190 88,198
      C 82,206 72,212 60,212
      C 50,212 42,206 40,198
      C 38,192 40,186 46,183
      C 50,181 54,182 58,185
      C 62,188 64,190 62,194
      C 60,196 56,196 54,194
      C 52,192 52,188 55,186
      C 52,184 48,184 46,186
      C 43,189 43,195 46,200
      C 50,206 60,208 68,205
      C 76,202 82,194 84,184
      C 86,174 86,160 85,148
      C 84,140 83,135 82,133
      C 83,132 86,132 88,133
      Z
    "/>

    <!-- B body — connected flowing script -->
    <path d="
      M 90,198
      C 92,192 96,182 100,172
      C 104,162 108,148 110,138
      C 112,130 113,126 116,124
      C 120,122 126,122 132,126
      C 140,130 146,138 146,148
      C 146,156 140,162 132,164
      C 126,165.5 120,164 116,162

      C 120,164 128,166 136,170
      C 146,176 152,184 152,194
      C 152,204 146,212 136,216
      C 128,219 118,217 110,212
      C 104,208 100,202 98,198

      C 96,204 92,208 88,210
      C 86,208 86,204 88,200
      C 89,198 90,198 90,198
      Z

      M 116,158
      C 122,157 130,155 134,150
      C 138,145 138,138 134,133
      C 130,128 124,127 120,128
      C 116,130 114,134 113,140
      C 112,148 114,155 116,158
      Z

      M 114,170
      C 112,176 110,184 110,190
      C 110,198 114,206 122,210
      C 130,214 140,210 144,202
      C 148,194 146,184 138,178
      C 132,173 124,170 118,170
      C 116,170 114,170 114,170
      Z
    " fill-rule="evenodd"/>
  </g>

  <!-- ═══ Subtitle ═══ -->
  <text
    x="110" y="268"
    text-anchor="middle"
    font-family="'Dancing Script', 'Snell Roundhand', 'Brush Script MT', cursive"
    font-size="30"
    font-weight="bold"
    fill="#1F1F1F"
    opacity="0.6"
    letter-spacing="0.5"
  >AnaJunubin</text>
</svg>
