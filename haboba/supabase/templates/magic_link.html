<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 40px; text-align: center; }
    .code { font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #333; margin: 24px 0; padding: 16px; background: #f0f0f0; border-radius: 8px; }
    .footer { color: #999; font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="color: #333; margin-bottom: 8px;">Your Haboba Login Code</h2>
    <p style="color: #666;">Enter this code in the app to sign in:</p>
    <div class="code">{{ .Token }}</div>
    <p class="footer">This code expires in 1 hour. If you didn't request this, you can ignore this email.</p>
  </div>
</body>
</html>
