version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: junubin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: junubin
    ports:
      - "5432:5432"
    volumes:
      - junubin_pg_data:/var/lib/postgresql/data

volumes:
  junubin_pg_data:
